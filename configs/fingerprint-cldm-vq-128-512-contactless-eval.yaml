model:
  base_learning_rate: 1e-6
  target: ldm.models.diffusion.cldm.C2CLControlLDM
  params:
    linear_start: 0.0015
    linear_end: 0.0155
    num_timesteps_cond: 1
    log_every_t: 200 
    timesteps: 1000 
    loss_type: l1 # 
    first_stage_key: "image" 
    cond_stage_key: "image" # no cond stage key
    control_key: "ID" 
    image_size: 128 # 
    channels: 3 # 
    cond_stage_trainable: False # freeze the pose stage
    concat_mode: False # no concat
    scale_by_std: True # using the calculated std as the scale factor
    use_ema: False # no ema
    monitor: 'val/loss_simple_ema'
    only_mid_control: False
    sd_locked: True # lock the sd part
    ckpt_path: Null # The ckpt part for the SD model # actually, it is not used

    control_stage_config: # Has the same structure as the main Unet SDM, copy the weights from the SDM
      target: ldm.modules.diffusionmodules.openaimodel.ControlNet
      params:
        image_size: 128 # unused
        in_channels: 3
        hint_channels: 1 # process the control image signal
        model_channels: 64
        attention_resolutions: [ 32, 16, 8]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4]
        num_heads: 8 # 
        use_scale_shift_norm: True
        resblock_updown: True

    cond_stage_config: "__is_unconditional__" # unconditional flags
    scheduler_config: # 10000 warmup steps
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps: [500] # 10000
        cycle_lengths: [1000000000000000]
        f_start: [1.e-2] # It is the scalar
        f_max: [1.]  #
        f_min: [ 1.]

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.ControlledUnetModel
      params:  #
        image_size: 128 # 
        in_channels: 3 # 
        out_channels: 3 # 
        model_channels: 64 #
        attention_resolutions: [ 32, 16, 8] # 32, 16, 8, 4 # consider one cross attention
        num_res_blocks: 2
        channel_mult: [ 1,2,4 ] # 32, 16, 8, 4, 2
        num_heads: 8 # 
        use_scale_shift_norm: True
        resblock_updown: True

    first_stage_config:
      target: ldm.models.autoencoder.VQModelInterface
      params:
        embed_dim: 3
        n_embed: 4096
        ddconfig:
          double_z: False
          z_channels: 3
          resolution: 512
          in_channels: 1
          out_ch: 1
          ch: 64
          ch_mult: [1,2,4]  # num_down = len(ch_mult)-1
          num_res_blocks: 2
          attn_resolutions: [16]
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity